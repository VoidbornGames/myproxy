# fly.toml app configuration file generated for myproxy-r9fwlq
# Corrected for TCP proxy

app = 'myproxy-r9fwlq'
primary_region = 'iad'

[build]

[[services]]
  internal_port = 8888
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 100
    soft_limit = 50
    type = "connections"

  [[services.ports]]
    port = 8888
    handlers = ["tls", "http"]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
