app = "myproxy-r9fwlq"   # change this to a unique name
primary_region = "iad"    # choose a region close to you

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 8888
  protocol = "tcp"

  [services.concurrency]
    hard_limit = 100
    soft_limit = 50
    type = "connections"

  [[services.ports]]
    port = 8888
    handlers = ["tls", "http"]   # this enables HTTPS on the public endpoint
